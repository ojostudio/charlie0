<style>
  #scrollTop {
    position: fixed;
    bottom: 32px;
    right: 32px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,.15);
    background: rgba(255,255,255,.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #1a1a18;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .35s ease, transform .35s ease, border-color .2s ease, background .2s ease;
    z-index: 50;
    box-shadow: 0 4px 16px -6px rgba(0,0,0,.15);
  }
  #scrollTop svg { width: 18px; height: 18px; }
  #scrollTop.is-visible { opacity: 1; pointer-events: auto; }
  #scrollTop:hover { border-color: rgba(0,0,0,.3); background: rgba(255,255,255,.95); transform: translateY(-3px); }
  #scrollTop { bottom: 96px; }
  @media (max-width: 900px) { #scrollTop { display: none; } }

  /* --- Botão flutuante WhatsApp --- */
  #waFloat {
    position: fixed;
    bottom: 32px;
    right: 32px;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: #fff;
    color: #25d366;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
    transition: transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .3s ease;
    z-index: 50;
  }
  #waFloat svg { width: 54px; height: 54px; }
  #waFloat:hover {
    transform: translateY(-4px) scale(1.08);
    box-shadow: 0 6px 16px rgba(0,0,0,.15);
  }
  @media (max-width: 640px) {
    #waFloat { bottom: 20px; right: 20px; width: 50px; height: 50px; }
    #waFloat svg { width: 50px; height: 50px; }
  }
</style>
<script>
  (() => {
    const btn = document.getElementById('scrollTop');
    if (!btn) return;
    window.addEventListener('scroll', () => {
      btn.classList.toggle('is-visible', window.scrollY > 400);
    }, { passive: true });
    btn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  })();
</script>
